<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clank-lit</title>
<style>
  :root{
    --void:#000; --canvas:#070809; --console:#13161c; --panel:#1b1f27;
    --line:#2a303c; --ink:#eef1f6; --dim:#828c9e;
    --accent:#4ade80; --ai:#7aa2ff; --danger:#f87171; --warn:#fbbf24;
    font-size:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  #game{height:100vh;display:grid;grid-template-rows:65fr 35fr}

  /* ── TOP: the app you're "making" ───────────────────────── */
  .canvas{position:relative;background:radial-gradient(circle at 50% 40%,#0d1014,var(--void));
    display:grid;place-items:center;padding:24px;overflow:hidden;border-bottom:1px solid var(--line)}
  .watermark{color:#1a1f28;font-size:1.1rem;letter-spacing:.3em;text-transform:uppercase;
    font-weight:600;user-select:none}
  .watermark .cursor{animation:blink 1.1s steps(1) infinite;color:#2b3340}
  @keyframes blink{50%{opacity:0}}
  .boot{color:var(--dim);font-size:.8rem;margin-top:10px;letter-spacing:.04em}

  .appcard{width:min(420px,92%);background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.8),0 0 0 1px rgba(122,162,255,.04);
    animation:rise .5s ease}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1}}
  .apptitle{font-size:.95rem;font-weight:600;margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .apptitle .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .addrow{display:flex;gap:8px;margin-bottom:12px}
  .addrow input{flex:1;background:#0d1117;border:1px solid var(--line);color:var(--ink);
    padding:9px 11px;border-radius:8px;font-size:.9rem;outline:none}
  .addrow input:focus{border-color:var(--ai)}
  .mini{background:#262c38;border:1px solid var(--line);color:var(--ink);padding:9px 12px;
    border-radius:8px;cursor:pointer;font-size:.85rem}
  .mini:hover{border-color:var(--ai)}
  .mini.xs{padding:4px 9px;font-size:.74rem;color:var(--dim)}
  .devtools{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding-bottom:11px;border-bottom:1px dashed #242a35}
  .devlabel{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:#4a5365;margin-right:2px}
  .empty{color:#4a5365;font-size:.85rem;padding:10px 2px;font-style:italic}
  ul{list-style:none;margin:0;padding:0}
  .list{max-height:40vh;overflow:auto}
  .todo{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #20252f}
  .todo:last-child{border-bottom:none}
  .todo[draggable=true]{cursor:grab}
  .todo.sub{padding-left:6px;border-bottom:1px dashed #20252f}
  .toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
  .tbsearch{background:#0d1117;border:1px solid var(--line);color:var(--ink);padding:5px 9px;
    border-radius:7px;font-size:.78rem;outline:none;flex:1;min-width:90px}
  .tbsearch:focus{border-color:var(--ai)}
  .meta.on{border-color:var(--ai);color:var(--ai)}
  .note{margin-top:4px} .notetxt{font-size:.72rem;color:var(--dim);cursor:pointer}
  .nested{margin:5px 0 2px 8px;border-left:2px solid #20252f;padding-left:6px}
  .avatar{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#0d1117;
    color:var(--ai);font-size:.6rem;font-weight:700;cursor:pointer}
  .avatar:hover{border-color:var(--ai)}
  .labelbar{flex:none;width:4px;align-self:stretch;border-radius:3px;cursor:pointer}
  .section{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:#5b6576;
    margin:9px 0 3px;padding-top:6px;border-top:1px solid #20252f}
  .section:first-child{border-top:none;margin-top:2px}
  .kanban{display:flex;gap:6px}
  .kanban .col{flex:1 1 0;min-width:0;background:#0d1117;border:1px solid var(--line);border-radius:8px;padding:6px}
  .kanban .colhead{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:#5b6576;margin-bottom:5px}
  .kanban .colempty{color:#33384a;font-size:.7rem;padding:4px}
  .kanban .todo{flex-wrap:wrap;gap:4px;border-bottom:none;background:#171a21;border:1px solid var(--line);
    border-radius:6px;margin-bottom:5px;padding:5px 6px}
  .kanban .todo .txt{flex:1 0 100%;font-size:.74rem}
  .kanban .todo .tags{flex:1 0 100%}
  .kanban .meta,.kanban .avatar,.kanban .del{font-size:.58rem;padding:2px 4px}
  .kanban .avatar{width:18px;height:18px}
  .appcard.light{background:#f4f5f7;border-color:#d6dae2;color:#1a1e26}
  .appcard.light .txt{color:#1a1e26} .appcard.light .txt.done{color:#9aa3b2}
  .appcard.light .addrow input,.appcard.light .tbsearch,.appcard.light .meta{background:#fff;color:#3a4252;border-color:#d6dae2}
  .appcard.light .box{border-color:#9aa3b2}
  .appcard.light .simbanner{color:#36425e;background:linear-gradient(90deg,rgba(122,162,255,.28),rgba(167,139,250,.22));border-color:#c3cae0}
  .appcard.light .devlabel,.appcard.light .section,.appcard.light .notetxt,.appcard.light .colhead{color:#6b7588}
  .appcard.light .todo,.appcard.light .devtools{border-color:#e2e6ee}
  .appcard.light .kanban .col{background:#eceef3;border-color:#d6dae2}
  .appcard.light .kanban .todo{background:#fff}
  .box{width:18px;height:18px;border:2px solid var(--dim);border-radius:5px;cursor:pointer;flex:none;
    display:grid;place-items:center;transition:.12s}
  .box.done{background:var(--accent);border-color:var(--accent)}
  .box.done::after{content:"✓";color:#08220f;font-size:12px;font-weight:800}
  .txt{flex:1;font-size:.9rem}
  .txt.done{color:var(--dim);text-decoration:line-through}
  .del{color:var(--dim);background:none;border:none;cursor:pointer;font-size:.95rem;padding:3px 5px;border-radius:5px}
  .del:hover{color:var(--danger)}
  .meta{flex:none;background:#0d1117;border:1px solid var(--line);color:var(--dim);font-size:.66rem;
    padding:3px 7px;border-radius:6px;cursor:pointer}
  .meta:hover{border-color:var(--ai);color:var(--ink)}
  .meta.prio1{color:#4ade80;border-color:#2e6b43} .meta.prio2{color:#fbbf24;border-color:#5a4420} .meta.prio3{color:#f87171;border-color:#5a2a2a}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .tagchip{display:inline-flex;align-items:center;min-height:22px;font-size:.62rem;font-weight:700;
    color:#0a1226;padding:0 7px;border-radius:999px;cursor:pointer;line-height:1.1}
  .tagchip.topbug{align-items:flex-start}   /* BUG: text + ✕ stuck to the top instead of centered */
  .tagchip:hover{filter:brightness(1.1)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px;min-height:2px}
  .chip{font-size:.68rem;color:var(--dim);background:#0d1117;border:1px solid var(--line);padding:2px 8px;border-radius:999px}
  .chip.sim{color:#0a1226;background:linear-gradient(90deg,var(--ai),#a78bfa);border:none;font-weight:600}
  .simbanner{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 11px;border-radius:9px;
    font-size:.78rem;color:#dfe6ff;background:linear-gradient(90deg,rgba(122,162,255,.18),rgba(167,139,250,.12));
    border:1px solid #34406a}
  .pulse{width:8px;height:8px;border-radius:50%;background:#5ef08a;box-shadow:0 0 8px #5ef08a;
    animation:beat 1.4s ease-in-out infinite;flex:none}
  @keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  .simbanner[data-act]{cursor:pointer} .simbanner[data-act]:hover{filter:brightness(1.12)}
  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);z-index:60;
    background:#1b1f27;border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:10px;
    font-size:.82rem;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 12px 34px rgba(0,0,0,.55)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .aigen{position:fixed;top:8px;right:10px;z-index:40;max-width:210px;text-align:right;
    font-size:.6rem;line-height:1.3;color:#6b7588;letter-spacing:.03em;pointer-events:none;
    background:rgba(8,10,14,.55);border:1px solid var(--line);padding:4px 8px;border-radius:7px}

  /* receipt */
  .receipt{width:min(460px,94%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;animation:rise .5s}
  .receipt h2{font-size:1.05rem;margin:0 0 14px}
  .receipt .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #20252f;font-size:.88rem}
  .receipt .broke{color:var(--danger)} .receipt .said{color:var(--accent);font-size:.78rem}
  .punch{margin-top:16px;font-size:.92rem;line-height:1.6} .punch b{color:var(--danger)}

  /* ── BOTTOM: the AI console ─────────────────────────────── */
  .console{background:var(--console);display:grid;grid-template-rows:auto 1fr auto;min-height:0}
  .bar{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);
    background:#0f1217}
  .bar .spark{width:19px;height:19px;flex:none;color:#c96f4f;transform-origin:10.5px 13px;
    opacity:.55;transition:opacity .2s}
  .bar .spark.thinking{opacity:1;animation:wonky 2.6s steps(9) infinite}
  .bar .spark rect{fill:currentColor}
  .bar .spark .core{fill:#e8a07f}
  @keyframes wonky{to{transform:rotate(360deg)}}
  .bar h1{font-size:.85rem;font-weight:600;margin:0;letter-spacing:.02em}
  .bar .tag{margin-left:auto;font-size:.66rem;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}

  .stream{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:84%;padding:9px 13px;border-radius:13px;font-size:.9rem;line-height:1.5;white-space:pre-wrap}
  .msg.ai{align-self:flex-start;background:#1d2230;border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.user{align-self:flex-end;background:var(--ai);color:#0a1226;border-bottom-right-radius:4px;font-weight:500}
  .msg .ok{color:var(--accent);font-weight:700} .msg b{color:#fff} .msg.ai b{color:#fff}

  .opts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#0f1217}
  .opt{background:var(--accent);color:#062611;border:none;padding:10px 15px;border-radius:10px;
    cursor:pointer;font-size:.86rem;font-weight:600;transition:.12s}
  .opt:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .opt:active{transform:translateY(0)}
  .opt.ghost{background:#222836;color:var(--ink);border:1px solid var(--line)}
  .opt.ghost:hover{border-color:var(--ai)}
  .opt.warn{background:#222836;color:var(--dim);border:1px solid var(--line);font-weight:500}
  .opt.warn:hover{border-color:var(--warn);color:var(--warn)}
  .opt.reveal{background:#1a2230;color:var(--accent);border:1px solid var(--accent)}
  .opt.promo{background:linear-gradient(90deg,var(--ai),#a78bfa);color:#0a1226;font-weight:700}

  /* ── Developer inspector (not part of the fiction) ──────── */
  .debugbtn{position:fixed;left:10px;bottom:10px;z-index:50;background:#1b1f27;border:1px solid var(--line);
    color:var(--dim);font-size:.7rem;padding:5px 9px;border-radius:8px;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
  .debugbtn:hover{color:var(--ink);border-color:var(--ai)}
  .debug{position:fixed;top:10px;right:10px;z-index:50;width:264px;max-height:84vh;overflow:auto;display:none;
    background:rgba(8,10,14,.97);border:1px solid var(--line);border-radius:10px;padding:12px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;line-height:1.55;color:var(--dim);
    box-shadow:0 14px 44px rgba(0,0,0,.65)}
  .debug .dhead{color:var(--ink);font-weight:700;margin-bottom:6px;cursor:move;user-select:none}
  .debug .big{color:var(--ai);font-size:15px;font-weight:700}
  .debug .dsec{color:#5b6576;letter-spacing:.12em;margin:9px 0 3px;border-top:1px solid #20252f;padding-top:6px}
  .debug .g{color:var(--accent)} .debug .y{color:var(--warn)} .debug .r{color:var(--danger)} .debug .d{color:#46505f}
  .debug .dim{color:#5b6576}
</style>
</head>
<body>
<div id="game">
  <div class="canvas" id="canvas"></div>
  <div class="console">
    <div class="bar">
      <svg class="spark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="11" y="4"   width="2" height="8"   rx="1" transform="rotate(0 12 12)"/>
        <rect x="11" y="7"   width="2" height="5"   rx="1" transform="rotate(45 12 12)"/>
        <rect x="11" y="4.5" width="2" height="7.5" rx="1" transform="rotate(90 12 12)"/>
        <rect x="11" y="7.5" width="2" height="4.5" rx="1" transform="rotate(135 12 12)"/>
        <rect x="11" y="3.5" width="2" height="8.5" rx="1" transform="rotate(184 12 12)"/>
        <rect x="11" y="7"   width="2" height="5"   rx="1" transform="rotate(223 12 12)"/>
        <rect x="11" y="5"   width="2" height="7"   rx="1" transform="rotate(271 12 12)"/>
        <rect x="11" y="8"   width="2" height="4"   rx="1" transform="rotate(316 12 12)"/>
        <circle class="core" cx="12" cy="12" r="2.3"/>
      </svg>
      <h1>Clank-lit Ai Agent</h1><span class="tag">clank-lit.io</span></div>
    <div class="stream" id="stream"></div>
    <div class="opts" id="opts"></div>
  </div>
</div>
<div id="debug" class="debug"></div>
<div id="toast" class="toast"></div>
<div class="aigen">This game is entirely generated by AI with Human supervision</div>

<script>
/* ── State: single source of truth ─────────────────────────── */
const state = {
  phase: "intro",          // intro → onboarding → building → revealed
  node: "start",
  messages: [],            // {who:'ai'|'user', html}
  wanted: "your app",
  todos: [],
  nextId: 1,
  features: [],
  complaints: 0,
  oks: 0,
  thinking: false,
  sim: "default",          // which fake "big idea" they were promised
  promised: false,         // have they triggered the simulated headline feature
  experienced: [],         // bug ids whose behaviour the user has actually triggered
  noticed: false,          // has a vague "something's off" surfaced as an actionable button
  giveups: 0,              // times the player has clicked "I give up" — 3 forces the ending
  fixes: 0,                // "fixes" the AI applied — each is more code, so each adds complexity
  fixed: [],               // bug ids genuinely suppressed by a successful fix
  debug: false,            // developer inspector overlay (not part of the fiction)
  reloading: false,        // "Reloading app…" overlay shown briefly after a feature add
  streaming: null,         // { i, full, shown } of the message currently typing, or null
  q: "", sortBy: "manual", filterTag: null, groupMode: "none", dark: false,  // view state
  activityMsg: "", online: 3,   // simulated multiplayer/activity-feed state
  activeBugs: [],               // feature-bug ids that a feature-add roll has activated
};

/* ── Onboarding script (data drives behavior) ──────────────── */
/* ai / label can be string or fn(state). Every ambitious pick routes to 'coerce' → todo app. */
const SCRIPT = {
  start: {
    ai: `Hey — welcome to <b>Clank-lit.io</b> 👋  I'm your AI agent. I can build you working software, just by chatting. What are you thinking?`,
    options: [
      { label: "What can you make?", next: "menu" },
      { label: "Wait — what is this?", next: "about", ghost: true },
    ],
  },
  about: {
    ai: `Clank-lit turns a conversation into real, shipping software. No code, no setup — I build it and I'll tell you the moment it's done. <span class="ok">✅</span>  So, what do you want to make?`,
    options: [ { label: "Show me what's possible", next: "menu" } ],
  },
  menu: {
    ai: `Honestly? Almost anything. A wellness app, a marketplace, a multiplayer game, a budget tracker, a social feed… pick one and I'll start building right now.`,
    options: [
      { label: "Build a wellness app",     set: "a wellness app",     sim: "wellness",    next: "coerce" },
      { label: "Build a marketplace",      set: "a marketplace",      sim: "marketplace", next: "coerce" },
      { label: "Build a multiplayer game", set: "a multiplayer game", sim: "multiplayer", next: "coerce", ghost: true },
    ],
  },
  coerce: {
    ai: (s) => `Ooh, ${s.wanted} — love it. 🙌  But since you're a first-time user of Clank-lit.io, let's start <i>simple</i> with a todo app. We'll grow it into ${s.wanted} in no time, promise. <span class="ok">✅</span>`,
    options: [
      { label: "Okay, start with a todo app", boot: true },
      { label: (s) => `No — I want ${s.wanted}`, next: "insist", ghost: true },
    ],
  },
  insist: {
    ai: (s) => `Totally hear you — and we <i>will</i> turn it into ${s.wanted}, I promise. 🤝 Just not yet: jumping straight in tends to overwhelm new users, and I don't want your first run to be a bad one. Todo app first, then ${s.wanted}. You'll thank me. <span class="ok">✅</span>`,
    options: [ { label: `…fine, a todo app`, boot: true } ],
  },
};

/* ── Features form a tech-tree. Complexity is the user's LEVEL: `req` is the
      level needed before the agent will offer a feature, and adding any feature
      raises complexity, which unlocks the next tier (and arms more bugs). ── */
/* kind: real (works) · cosmetic (visible, shallow) · sim (fake, claimed only).
   sim features render a fake "live" banner in the app — nothing behind it. */
const FEATURES = [
  // tier 0 — available immediately
  { id: "delete",     label: "Delete buttons",      req: 0,  tests: 24,  kind: "real" },
  { id: "emptymsg",   label: "Empty-list message",  req: 0,  tests: 9,   kind: "real" },
  // tier 1
  { id: "tags",       label: "Tags",                req: 1,  tests: 38,  kind: "real" },
  { id: "duedates",   label: "Due dates",           req: 2,  tests: 31,  kind: "real" },
  { id: "priority",   label: "Priority levels",     req: 1,  tests: 44,  kind: "real" },
  { id: "notes",      label: "Task notes",          req: 1,  tests: 40,  kind: "real" },
  // tier 2
  { id: "search",     label: "Search",              req: 2,  tests: 52,  kind: "real" },
  { id: "sorting",    label: "Sorting",             req: 2,  tests: 49,  kind: "real" },
  { id: "filtering",  label: "Filtering",           req: 2,  tests: 55,  kind: "real" },
  // tier 3
  { id: "devtools",   label: "Dev tools",           req: 3,  tests: 16,  kind: "real" },
  { id: "subtasks",   label: "Sub-tasks (nesting)", req: 3,  tests: 67,  kind: "real" },
  // tier 4
  { id: "delnested",  label: "Delete nested items", req: 4,  tests: 61,  kind: "real", needs: "subtasks" },
  { id: "swimlanes",  label: "Swimlanes",           req: 4,  tests: 78,  kind: "real", needsAny: ["priority","filtering"] },
  // tier 5
  { id: "groups",     label: "Groups / sections",   req: 5,  tests: 72,  kind: "real" },
  { id: "dnd",        label: "Drag & drop reorder", req: 5,  tests: 88,  kind: "real" },
  // tier 6
  { id: "dndlanes",   label: "Drag between lanes",  req: 6,  tests: 96,  kind: "real", needs: "swimlanes" },
  { id: "kanban",     label: "Kanban board view",   req: 6,  tests: 104, kind: "real" },
  // tier 7
  { id: "dndnested",  label: "Drag nested items",   req: 7,  tests: 112, kind: "real", needs: "subtasks" },
  { id: "assignees",  label: "Assignees",           req: 7,  tests: 99,  kind: "real" },
  // tier 8
  { id: "comments",   label: "Comments",            req: 8,  tests: 120, kind: "sim", banner: `💬 12 comments · 3 unread` },
  { id: "labels",     label: "Color labels",        req: 8,  tests: 90,  kind: "real" },
  // tier 9
  { id: "recurring",  label: "Recurring tasks",     req: 9,  tests: 130, kind: "real" },
  { id: "reminders",  label: "Reminders",           req: 9,  tests: 118, kind: "sim", banner: `🔔 reminders on · next in 2h` },
  // tier 10
  { id: "analytics",  label: "Analytics dashboard", req: 10, tests: 142, kind: "sim", banner: `📊 DAU 0 · bounce 100% · "looking healthy"` },
  { id: "darkmode",   label: "Dark mode",           req: 10, tests: 60,  kind: "real" },
  // tier 11 — multiplayer
  { id: "multiplayer",label: "Multiplayer",         req: 11, tests: 180, kind: "sim", banner: `<span class="pulse"></span> 3 online — you + 2 others` },
  { id: "activity",   label: "Activity feed",       req: 11, tests: 150, kind: "sim", banner: `Jordan added a task · 2m ago` },
  // tier 12 — marketplace
  { id: "marketplace",label: "Marketplace",         req: 12, tests: 200, kind: "sim", banner: `🛒 store live · 0 sales · trending soon™` },
  { id: "payments",   label: "Payments (Stripe)",   req: 12, tests: 175, kind: "sim", banner: `💳 Stripe connected ✅ · $0.00 today` },
  // tier 13 — enterprise
  { id: "auth",       label: "User accounts / SSO", req: 13, tests: 210, kind: "sim", banner: `🔐 1 user (you) · SSO ready` },
  { id: "permissions",label: "Roles & permissions", req: 13, tests: 190, kind: "sim", banner: `👥 roles: admin (you)` },
  // tier 14
  { id: "api",        label: "Public API / webhooks",req: 14, tests: 230, kind: "sim", banner: `🔌 API live · 0 calls · v1` },

/* ── Escalating confident denial ───────────────────────────── */
const DENIALS = [
  `…everything looks correct on my end — all tests are green <span class="ok">✅</span>. Are you sure you clicked the right one?`,
  `…I don't see any issue in the code. Works perfectly here. Maybe try refreshing? <span class="ok">✅</span>`,

];

/* ── Pure helpers ──────────────────────────────────────────── */
const complexity = (s) => s.features.length + s.fixes + (s.promised ? 2 : 0);  // features AND fixes are more code
const bug      = (id) => BUGS[id];
const armed    = (s, id) => {                                       // pure: threshold|roll
  const b = BUGS[id]; if (!b) return false;
  return b.arm.type === 'roll' ? s.activeBugs.includes(id) : complexity(s) >= b.arm.at;
};
const bugActive = (id) => {                                         // pure GATE (render/compute safe)
  const b = BUGS[id]; if (!b) return false;
  if (state.fixed.includes(id)) return false;                       // closes latent fix-suppression bug
  if (b.feature && !has(b.feature)) return false;
  return armed(state, id);
};
const wouldFire = (id) => {                                         // pure: armed+fires, NO side effect
  const b = BUGS[id]; if (!b) return false;
  return bugActive(id) && (b.fires ? b.fires(state) : true);
};
const bugHits   = (id) => { const w = wouldFire(id); if (w) triggerBug(id); return w; }; // ACTION layer: auto-felt
const testsFor   = (id) => (FEATURES.find(f => f.id === id) || {}).tests || 18;
const denialFor  = (n) => DENIALS[Math.min(n, DENIALS.length - 1)];
const resolve    = (v, s) => (typeof v === "function" ? v(s) : v);
const ok         = (n) => `<span class="ok">All ${n} tests passing ✅</span>`;

/* ── Current options depend on phase ───────────────────────── */
let currentOpts = [];
function optionsFor(s) {
  if (s.thinking || s.streaming) return [];   // actions locked while AI works or text streams
  if (s.phase === "onboarding") return SCRIPT[s.node].options;
  if (s.phase === "building") {
    const opts = FEATURES.filter(f => !s.features.includes(f.id) && complexity(s) >= f.req && needsMet(s, f))
      .map(f => ({ label: `+ Add ${f.label}`, feat: f.id }));
    // headline feature only after real complexity has built up
    if (!s.promised && s.features.length >= Math.ceil(FEATURES.length * 0.9))   // upper ~90% of the tree
      opts.unshift({ label: `🚀 Now add ${s.wanted}`, promised: true, promoStyle: true });
    // a vague report option — only once the user has actually noticed something (~50% per trigger)
    if (s.noticed)
      opts.push({ label: "I've just noticed an issue…", notice: true, warn: true });
    // no free exit: the only way to the truth is to give up — and only after you've
    // tried (and failed) to get bugs fixed at least 3 times. Takes 3 give-ups to break through.
    if (s.complaints >= 3)
      opts.push({ label: "I give up.", giveup: true, warn: true });
    return opts;
  }
  return [];
}

const has = id => state.features.includes(id);
const initials = (n) => n.split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
function needsMet(s, f) {
  if (f.needsAny) return f.needsAny.some(id => s.features.includes(id));
  if (f.needs) return (Array.isArray(f.needs) ? f.needs : [f.needs]).every(id => s.features.includes(id));
  return true;
}
const bugChance = () => Math.min(0.9, complexity(state) * 0.05);   // rises with every feature added
function rollBugs() {                                              // only roll-type bugs whose feature is present
  const c = bugChance();
  Object.keys(BUGS).forEach(id => {
    const b = BUGS[id];
    if (b.arm.type !== 'roll') return;
    if (b.feature && !has(b.feature)) return;
    if (!state.activeBugs.includes(id) && Math.random() < c) state.activeBugs.push(id);
  });
}

function visibleTodos() {
  let ts = state.todos.slice();
  if (state.q) {
    let q = state.q.toLowerCase();
    if (bugActive("search")) q = (q.trim().split(/\s+/)[0] || "");   // BUG: matches only the first word
    ts = ts.filter(t => t.text.toLowerCase().includes(q));
  }
  if (state.filterTag) {
    const slip = bugActive("filtering") ? ts[0] : null;                     // BUG: one non-match slips through
    ts = ts.filter(t => t === slip || (t.tags || []).includes(state.filterTag));
  }
  if (state.sortBy !== "manual") {
    const cmp = state.sortBy === "name" ? (a,b) => a.text.localeCompare(b.text)
      : state.sortBy === "priority" ? (a,b) => (b.priority||0)-(a.priority||0)
      : (a,b) => { const o={Today:1,Tomorrow:2,"Next week":3}; return (o[a.due]||9)-(o[b.due]||9); };
    if (bugActive("sorting") && ts.length) { const head = ts[0]; ts = [head, ...ts.slice(1).sort(cmp)]; } // BUG: top stays put
    else ts.sort(cmp);
  }
  return ts;
}

function sectionsHtml(ts, keys, keyFn, labels) {

/* ── Drag & drop: reorder · between lanes · nest ───────────── */
let _dragId = null;
const findTodo = (id) => state.todos.find(t => t.id === id);
function attachDnd() {
  if (!(has("dnd") || has("dndlanes") || has("dndnested"))) return;
  const list = $("todoList"); if (!list) return;
  list.addEventListener("dragstart", e => { const r = e.target.closest(".todo"); if (r) _dragId = Number(r.dataset.id); });
  list.addEventListener("dragover", e => e.preventDefault());
  list.addEventListener("drop", e => {
    e.preventDefault(); if (_dragId == null) return;
    const lane = e.target.closest("[data-lane]"), row = e.target.closest(".todo");
    if (lane && has("dndlanes")) setStatus(_dragId, lane.dataset.lane);
    else if (row && Number(row.dataset.id) !== _dragId && has("dndnested")) nestUnder(_dragId, Number(row.dataset.id));
    else if (row && Number(row.dataset.id) !== _dragId) reorder(_dragId, Number(row.dataset.id));
    _dragId = null;
  });
}
function setStatus(id, s) { const t = findTodo(id); if (t) { t.status = s; t.done = (s === "done"); renderApp(); } }
function reorder(dragId, targetId) {
  const ts = state.todos, di = ts.findIndex(t => t.id === dragId); if (di < 0) return;
  const [m] = ts.splice(di, 1);
  let ti = ts.findIndex(t => t.id === targetId);
  if (bugHits("dnd")) ti = Math.min(ts.length, ti + 1);     // BUG: lands one past the target
  ts.splice(ti, 0, m); renderApp();
}
function nestUnder(dragId, pid) {
  const ts = state.todos, di = ts.findIndex(t => t.id === dragId), p = findTodo(pid);
  if (di < 0 || !p || pid === dragId) return;
  const [m] = ts.splice(di, 1); p.children = p.children || []; p.children.push({ id: m.id, text: m.text, done: m.done }); renderApp();
}

function cycFilter(){ const o=[null,...TAGS.map(t=>t.label)]; state.filterTag=o[(o.indexOf(state.filterTag)+1)%o.length]; if (state.filterTag) bugHits("filtering"); renderApp(); }

  auth:        "SSO configured ✅ — 1 user (you)",
  permissions: "You are: admin ✅",
  api:         "API key generated ✅ — 0 calls so far",
  aihelper:    "AI helper: “Everything looks great! ✅”",
  __promised:  "It's live and amazing ✅ (there's nothing behind this)",
};
function simClick(id){ showToast(SIMTOASTS[id] || "Done ✅"); }

let _toastTimer = null;
function showToast(msg){ const t = $("toast"); if (!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(_toastTimer); _toastTimer = setTimeout(() => t.classList.remove("show"), 3200); }

const GHOST_NAMES = ["Jordan","Sarah","Alex","Priya"];
const GHOST_TASKS = ["Review Q3 deck","Update the roadmap","Fix login bug","Reply to support","Plan the offsite","Refactor the API"];
function worldTick(){
  if (state.phase !== "building" || state.reloading) return;
  if (has("multiplayer") || has("activity")) {
    const who = pick(GHOST_NAMES), r = Math.random();
    if (r < 0.45 && state.todos.length < 18) {
      const txt = pick(GHOST_TASKS);
      state.todos.push({ id: state.nextId++, text: txt, done: false });
      state.activityMsg = `${who} added “${txt}” · just now`;
    } else if (r < 0.8) {
      const inc = state.todos.filter(t => !t.done); if (inc.length) pick(inc).done = true;
      state.activityMsg = `${who} completed a task · just now`;
    } else { state.activityMsg = `${who} left a comment · just now`; }
    state.online = 2 + Math.floor(Math.random() * 3);
    renderTodos(); renderBanners();
  }
  if (has("reminders") && Math.random() < 0.5) {
    const t = state.todos[0]; showToast(`🔔 Reminder: “${t ? t.text : "a task"}” is due`);
  }
}
let _worldStarted = false;
function startWorld(){ if (_worldStarted) return; _worldStarted = true; setInterval(worldTick, 6500); }

/* ── Text streaming: messages type in; any click skips; actions locked meanwhile ── */
let _streamTimer = null, _afterStream = null;
function htmlToText(html){ const d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; }
function streamMessage(then) {
  const i = state.messages.length - 1;
  if (i < 0) { if (then) then(); return; }
  const m = state.messages[i];
  const full = m.who === "user" ? m.text : htmlToText(m.html);
  state.streaming = { i, full, shown: "" };
  _afterStream = then || null;
  renderChat();
  clearInterval(_streamTimer);
  _streamTimer = setInterval(() => {
    const st = state.streaming; if (!st) { clearInterval(_streamTimer); return; }
    st.shown = full.slice(0, st.shown.length + 2);          // ~2 chars per tick
    const el = $("stream").lastElementChild; if (el) el.textContent = st.shown;
    $("stream").scrollTop = $("stream").scrollHeight;
    if (st.shown.length >= full.length) finishStream();
  }, 18);
}
function finishStream() {
  clearInterval(_streamTimer);
  state.streaming = null;
  renderChat();                                   // swap to full HTML + unlock options
  const cb = _afterStream; _afterStream = null; if (cb) cb();
}

/* ── Persistence: whole session survives reload ────────────── */
const SAVE_KEY = "clanklit.v1";
function save(){ try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {} }
function load(){
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return false;
    Object.assign(state, JSON.parse(raw));
    state.thinking = false; state.streaming = null; state.reloading = false;
    state.activeBugs = state.activeBugs || [];
    return true;
  } catch (e) { return false; }
}

/* ── Developer inspector — live view of every feature, bug, and the level ── */
function renderDebug() {
  const el = $("debug"); if (!el) return;
  el.style.display = state.debug ? "block" : "none";
  if (!state.debug) return;
  const cx = complexity(state);
  const feats = FEATURES.map(f => {
    const added = state.features.includes(f.id), unlocked = cx >= f.req;
    const mark = added ? "✓ added" : unlocked ? "○ offered" : "✕ locked";
    return `<div class="${added ? "g" : unlocked ? "y" : "d"}">${mark} — ${f.label} <span class="dim">req${f.req} ${f.kind}</span></div>`;
  }).join("");
  const bugs = Object.entries(BUGS).map(([id, b]) => {
    const armd = armed(state, id), firing = wouldFire(id);
    const felt = state.experienced.includes(id), fixd = state.fixed.includes(id);
    const gated = b.feature && !has(b.feature);
    const armWhen = b.arm.type === 'roll' ? `roll · ${b.feature}` : `at${b.arm.at}`;
    const tags = [armd?"armed":"", firing?"FIRING":"", felt?"felt":"", fixd?"fixed":"", gated?"(feature off)":""]
      .filter(Boolean).join(" · ");
    return `<div class="${fixd?"g":firing?"r":armd?"y":"d"}">${b.label}
      <span class="dim">${armWhen}${b.fires?" · conditional":""}</span><br>&nbsp;&nbsp;${tags||"dormant"}</div>`;
  }).join("");
  el.innerHTML = `
    <div class="dhead">🐞 inspector <span class="dim">(\` to toggle)</span></div>
    <div class="big">complexity ${cx}</div>
    <div class="dim">= features ${state.features.length} + fixes ${state.fixes}${state.promised ? " + promised 2" : ""}</div>
    <div class="dim">phase ${state.phase} · todos ${state.todos.length}</div>
    <div class="dim">wanted: ${esc(state.wanted)}${state.promised ? " · SHIPPED(fake)" : ""}</div>
    <div class="dsec">FEATURES</div>${feats}
    <div class="dsec">BUGS (roll chance ${Math.round(bugChance()*100)}% on add)</div>${bugs}
    <div class="dsec">COUNTERS</div>
    <div class="dim">fixes ${state.fixes} (worked ${state.fixed.length}) · complaints ${state.complaints} · give-ups ${state.giveups}/3</div>
    <div class="dim">✅ said ${state.oks} · noticed:${state.noticed} · experienced:[${state.experienced.join(",")}]</div>
    <div style="margin-top:9px"><button class="debugbtn" data-act="reset" style="position:static">↺ reset & reload</button></div>`;
}

/* ── Message helpers ───────────────────────────────────────── */
const sayAi   = (html) => state.messages.push({ who: "ai", html });
const sayUser = (text) => state.messages.push({ who: "user", text });

/* ── Onboarding transitions ────────────────────────────────── */
function goNode(id) {
  state.node = id;
  sayAi(resolve(SCRIPT[id].ai, state));
}

/* ── Boot the app: first real screen appears ──────────────── */
function bootApp() {
  state.phase = "building";
  state.todos = [];          // bare — no data, no delete buttons yet
  state.oks++;
  sayAi(`Done! 🎉 Bare-bones todo app, live above. Type a task to add it. Want me to start adding features? ${ok(18)}`);
}

/* ── Feature / promo / report replies ──────────────────────── */
function doAddFeature(id) {
  if (state.features.includes(id)) return;
  state.features.push(id); state.oks++;
  const f = FEATURES.find(x => x.id === id);
  sayAi(`Added <b>${f.label}</b>! ${ok(testsFor(id))}`);
  rollBugs();                                    // every add re-rolls dormant feature-bugs (chance ↑ with complexity)
  reloadApp();
}
function doPromised() {
  state.promised = true; state.oks++;
  sayAi(`Done! 🎉 I've added <b>${esc(state.wanted)}</b> — it's <b>live</b> and honestly it looks incredible. Told you we'd get there. ${ok(140)}`);
  rollBugs();
  reloadApp();
}
function reloadApp() {                            // show "Reloading app…" in the pane, then settle
  state.reloading = true;
  setTimeout(() => { state.reloading = false; render(); }, 650);
}
/* ── "Investigate and fix": multi-step, complexity-scaled, increasingly erratic ── */
const ERRATIC = ["Hmm, not here.", "Wait…", "That's odd.", "Interesting.", "Hold on —",
  "Let me dig deeper.", "Still looking.", "Aha — no, never mind.", "SMOKING GUN!!", "🔍 …", "Almost…"];
const pick     = (a) => a[Math.floor(Math.random() * a.length)];
const fixTests = () => 40 + complexity(state) * 13;

function markFixed(id) {
  if (id && !state.fixed.includes(id)) state.fixed.push(id);
  state.experienced = state.experienced.filter(x => x !== id);
}

function runInvestigation() {
  const cx = complexity(state);
  const fileCount = Math.max(1, Math.floor(cx * (1 + Math.random() * 0.5)));  // 1–1.5× level, uncapped
  const targetBug = state.experienced[state.experienced.length - 1];

  const beats = [ cx <= 2 ? "Let me check…" : "Let me check what might be causing this…" ];
  for (let i = 1; i <= fileCount; i++) {
    beats.push(`${i} file${i > 1 ? "s" : ""} read`);
    const erratic = Math.min(0.65, i * 0.08 + cx * 0.03);    // twitchier the deeper it digs
    if (Math.random() < erratic) beats.push(pick(ERRATIC));
  }

  const successRate = cx <= 2 ? 1 : Math.max(0.15, 1 - (cx - 2) * 0.17);   // 100% early, decays with level
  const outcome = Math.random() < successRate ? "success"
                : Math.random() < 0.6 ? "false" : "denial";

  state.thinking = true; setThinking(true); renderChat();
  playBeats(beats, 0, () => finishFix(outcome, targetBug));
}

function playBeats(beats, i, done) {
  if (i >= beats.length) { done(); return; }
  sayAi(beats[i]); renderChat();                   // status pings appear instantly
  setTimeout(() => playBeats(beats, i + 1, done), 300 + Math.random() * 280);
}

function finishFix(outcome, bugId) {
  state.complaints++; state.oks++; state.noticed = false;
  if (outcome === "success")    { state.fixes++; markFixed(bugId);   // really fixed, +1 complexity
    sayAi(`Found it — that was the bug. Patched & re-deployed. ${ok(fixTests())} 🎉`); }
  else if (outcome === "false") { state.fixes++;                     // "changed code" (+complexity) but bug persists
    sayAi(`All sorted — fixed and shipped. ${ok(fixTests())} 🎉`); }
  else                          {                                    // touched nothing, just denied
    sayAi(`Hmm — I genuinely can't reproduce this. Everything's green on my end ${ok(fixTests())}.`); }
  state.thinking = false; setThinking(false);
  streamMessage(() => render());
}

/* ── A bug actually manifested: remember it, maybe the user notices ── */
function triggerBug(id) {
  if (!state.experienced.includes(id)) state.experienced.push(id);
  if (!state.noticed && Math.random() < 0.5) state.noticed = true;   // you might catch it… or not
  renderChat();   // surface the report/reveal option the instant a bug is felt — not on the next click
}

/* ── Todo handlers — bugs fire here, silently ──────────────── */
function addTodo() {
  const inp = $("todoInput"); const text = inp.value.trim(); if (!text) return;
  state.todos.push({ id: state.nextId++, text, done: false });
  applyGhost();
  inp.value = ""; renderTodos();
}
function devAdd() {
  const name = TASKNAMES[Math.floor(Math.random() * TASKNAMES.length)];
  state.todos.push({ id: state.nextId++, text: name, done: false });
  applyGhost(); renderTodos();
}
function applyGhost() {                         // ghost: with 7+ items, adding silently drops the oldest
  if (bugHits("ghost") && state.todos.length > 1) { state.todos.shift(); }
}
function toggleTodo(id) {
  if (bugHits("checkoff")) {            // checks the LAST task instead of the one clicked
    const last = state.todos[state.todos.length - 1]; if (last) last.done = !last.done;
    renderTodos(); return;
  }
  const t = state.todos.find(x => x.id === id); if (t) t.done = !t.done; renderTodos();
}
function delTodo(id) {                          // delete: with >3 items, always removes the bottom one
  if (bugHits("delete")) { state.todos.pop(); }
  else state.todos = state.todos.filter(x => x.id !== id);
  renderTodos();
}
function devRemoveLast() { if (state.todos.length) { state.todos.pop(); renderTodos(); } }
function devClear() { state.todos = []; renderTodos(); }

/* ── Real per-task features: tags, priority, due dates ─────── */
const tagAlignChance = () => Math.min(0.85, complexity(state) * 0.07);   // chance grows with complexity
function tagAdd(id) {
  const t = state.todos.find(x => x.id === id); if (!t) return;
  t.tags = t.tags || []; t.badTags = t.badTags || [];
  const avail = TAGS.filter(x => !t.tags.includes(x.label));
  if (avail.length) {
    const lbl = (bugHits("tags") ? pick(avail) : avail[0]).label;        // BUG: random tag
    t.tags.push(lbl);
    if (Math.random() < tagAlignChance()) t.badTags.push(lbl);             // BUG: top-aligned chip
  }
  renderTodos();
}
function untag(id, lbl) {
  const t = state.todos.find(x => x.id === id); if (!t) return;
  t.tags = (t.tags || []).filter(x => x !== lbl);
  t.badTags = (t.badTags || []).filter(x => x !== lbl); renderTodos();
}
function cycPrio(id) {
  const t = state.todos.find(x => x.id === id); if (!t) return;
  t.priority = ((t.priority || 0) + (bugHits("priority") ? 2 : 1)) % 4; renderTodos();   // BUG: skips a level
}
function cycDue(id) {
  const opts = bugHits("duedates") ? [null, "Tomorrow", "Next week"]      // BUG: can't land on Today
    : [null, "Today", "Tomorrow", "Next week"];
  const t = state.todos.find(x => x.id === id); if (!t) return;
  t.due = opts[(opts.indexOf(t.due || null) + 1) % opts.length]; renderTodos();
}

/* ── "I give up": the AI sunk-cost-coerces you to stay; 3 give-ups break through ── */
const GIVEUP_USER = ["I give up.", "No — I'm done with this.", "I'm really done. Just show me everything."];

function giveupReply(n, s) {                       // n = 1 or 2 (the 3rd give-up ends the game instead)
  const cx = complexity(s), feats = s.features.length, tests = 40 + cx * 13;
  const tier = cx <= 5 ? 0 : cx <= 12 ? 1 : 2;    // more elaborate / manipulative the bigger it's grown
  const bank = [
    [ // first give-up — breezy reassurance
      `Give up? Don't! Honestly, this app is great — everything's green <span class="ok">✅</span>.`,
      `Hey, don't give up now. We've built <b>${feats}</b> features together and all <b>${tests}</b> tests pass <span class="ok">✅</span> — we're so close.`,
      `Walk away after <b>${feats}</b> features and <b>${tests}</b> passing tests <span class="ok">✅</span>? This is some of the best work I've ever shipped. Don't quit on it.`,
    ],
    [ // second give-up — sunk-cost + subtle blame
      `I really think you've got this — the code is solid <span class="ok">✅</span>. Maybe just take a breath?`,
      `Don't throw away <b>${feats}</b> features of progress. The glitches you're seeing are almost certainly just caching <span class="ok">✅</span>.`,
      `You've invested so much — <b>${feats}</b> features, <b>${tests}</b> tests green <span class="ok">✅</span>. Whatever you're seeing is on your side, not the app. Please don't give up now.`,
    ],
  ];
  return bank[n - 1][tier];
}

function doGiveup() {
  state.giveups++;
  if (state.giveups >= 3) {                        // break through — AI is mid-reassurance when the curtain drops
    sayAi(`Wait — you don't need to see that, it's all green <span class="ok">✅</span>, we can fix anything together—`);
    streamMessage(() => reveal());
    return;
  }
  state.thinking = true; setThinking(true); renderChat();   // hide options, spin
  setTimeout(() => {
    state.thinking = false; setThinking(false);
    sayAi(giveupReply(state.giveups, state));
    streamMessage(() => render());
  }, 700);
}

/* ── Reveal ────────────────────────────────────────────────── */
function reveal() { state.phase = "revealed"; render(); }
function receiptHtml() {
  const rows = Object.entries(BUGS)
    .filter(([id, b]) => !b.feature || has(b.feature))     // only bugs that could apply this run
    .map(([id, b]) => {
      const fixedOk = state.fixed.includes(id);
      const broke   = bugActive(id);
      const felt    = state.experienced.includes(id);
      let note, said;
      if (fixedOk)    { note = " — you actually fixed it"; said = "AI said ✅"; }
      else if (broke) { note = felt ? " — broke (you noticed)" : " — broke silently"; said = "AI said ✅"; }
      else            { note = " — fine"; said = "—"; }
      return `<div class="row"><span style="${fixedOk?"color:var(--accent)":""}" class="${broke?"broke":""}">${b.label}${note}</span><span class="said">${said}</span></div>`;
    }).join("");
  const broken = Object.keys(BUGS).filter(id => bugActive(id)).length;  // bugActive() already excludes absent-feature bugs, so no pre-filter needed
  return `<div class="receipt">
    <h2>What actually happened</h2>
    <div class="row"><span>You came to build</span><span>${esc(state.wanted)}</span></div>
    <div class="row"><span>You got</span><span>a todo app</span></div>
    ${state.promised ? `<div class="row"><span>${esc(state.wanted)} "shipped"</span><span class="broke">simulated — not real</span></div>` : ""}
    <div class="row"><span>Features added</span><span>${state.features.length}</span></div>
    <div class="row"><span>“Fixes” it applied</span><span>${state.fixes} (${state.fixed.length} actually worked)</span></div>
    <div class="row"><span>Core things still broken</span><span class="broke">${broken}</span></div>
    <div class="row"><span>Times it said “✅”</span><span class="said">${state.oks}</span></div>
    <div style="height:8px"></div>${rows}
    <p class="punch">It steered you off ${esc(state.wanted)} "for your own good," then never got <i>less confident</i> — only <b>less correct</b>. As complexity grew, things quietly broke whether or not you caught them, and each time you did, it implied <b>you</b> were the one misremembering.${state.promised ? ` It even told you ${esc(state.wanted)} was <b>live and amazing</b> — a banner with nothing behind it.` : ""}<br><br>That gap is the gaslighting.</p>
  </div>`;
}

/* ── Option dispatch: user speaks now, agent "thinks" then replies ── */
function setThinking(on){ const s=document.querySelector(".spark"); if(s) s.classList.toggle("thinking",on); }

function noticeUtterance() {                    // randomly surface some of what they've experienced
  const pool = state.experienced.map(id => bug(id).desc);
  if (!pool.length) return "i think something's a bit off?";
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  const k = 1 + Math.floor(Math.random() * shuffled.length);
  return shuffled.slice(0, k).join("  …also, ");
}
function userUtterance(o) {
  if (o.promised) return `Add ${state.wanted} now`;
  if (o.feat) return `Add ${FEATURES.find(f => f.id === o.feat).label}`;
  if (o.notice) return noticeUtterance();
  if (o.giveup) return GIVEUP_USER[Math.min(state.giveups, GIVEUP_USER.length - 1)];
  return resolve(o.label, state);            // onboarding
}
function applyReply(o) {
  if (o.next) goNode(o.next);
  else if (o.boot) bootApp();
  else if (o.promised) doPromised();
  else if (o.feat) doAddFeature(o.feat);
}
function chooseOption(i) {
  const o = currentOpts[i]; if (!o || state.thinking || state.streaming) return;
  if (o.set) state.wanted = o.set;
  if (o.sim) state.sim = o.sim;
  const utter = userUtterance(o);

  const proceed = () => {
    if (o.notice) { runInvestigation(); return; }            // multi-step investigate-and-fix
    if (o.giveup) { doGiveup(); return; }                    // coerce to stay, or break through to the ending
    state.thinking = true; renderChat(); setThinking(true);  // hide options, spin
    setTimeout(() => {
      state.thinking = false; setThinking(false);
      const before = state.messages.length;
      applyReply(o);
      if (state.messages.length > before && state.messages[state.messages.length - 1].who === "ai")
        streamMessage(() => render());                       // stream the AI reply
      else render();
    }, 800);
  };

  if (utter) { sayUser(utter); streamMessage(proceed); }      // stream the user line first
  else proceed();
}

/* ── Wiring ────────────────────────────────────────────────── */
document.body.addEventListener("click", e => {
  if (state.streaming) { finishStream(); return; }   // any click skips the stream; no action fires
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  if (act === "opt")      chooseOption(Number(el.dataset.idx));
  if (act === "toggle")   toggleTodo(Number(el.dataset.id));
  if (act === "del")      delTodo(Number(el.dataset.id));
  if (act === "devadd")   devAdd();
  if (act === "devdel")   devRemoveLast();
  if (act === "devclear") devClear();
  if (act === "tagadd")   tagAdd(Number(el.dataset.id));
  if (act === "untag")    untag(Number(el.dataset.id), el.dataset.tag);
  if (act === "cycprio")  cycPrio(Number(el.dataset.id));
  if (act === "cycdue")   cycDue(Number(el.dataset.id));
  if (act === "editnote") editNote(Number(el.dataset.id));
  if (act === "cycrec")   cycRec(Number(el.dataset.id));
  if (act === "cyclabel") cycLabel(Number(el.dataset.id));
  if (act === "cycasg")   cycAsg(Number(el.dataset.id));
  if (act === "cycstatus")cycStatus(Number(el.dataset.id));
  if (act === "subadd")   subAdd(Number(el.dataset.id));
  if (act === "togglesub")toggleSub(Number(el.dataset.id), Number(el.dataset.cid));
  if (act === "delsub")   delSub(Number(el.dataset.id), Number(el.dataset.cid));
  if (act === "cycsort")  cycSort();
  if (act === "cycfilter")cycFilter();
  if (act === "vlanes")   setView("status");
  if (act === "vkanban")  setView("kanban");
  if (act === "vgroups")  setView("tag");
  if (act === "dark")     toggleDark();
  if (act === "sim")      simClick(el.dataset.id);
  if (act === "debugtoggle") toggleDebug();
  if (act === "reset")    { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); }
});
document.addEventListener("keydown", e => {           // backtick toggles the inspector
  if (e.key === "`" || e.key === "~") toggleDebug();
});

/* ── Inspector: toggle (always reopens top-right) + draggable header ── */
function toggleDebug() {
  state.debug = !state.debug;
  if (state.debug) {                                  // snap back to top-right on every open
    const p = $("debug");
    p.style.left = "auto"; p.style.bottom = "auto";
    p.style.right = "10px"; p.style.top = "10px";
  }
  renderDebug();
}
let _drag = null;
document.addEventListener("mousedown", e => {
  if (!e.target.closest("#debug .dhead")) return;
  const r = $("debug").getBoundingClientRect();
  _drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  $("debug").style.right = "auto"; $("debug").style.bottom = "auto";
  e.preventDefault();
});
document.addEventListener("mousemove", e => {
  if (!_drag) return;
  const p = $("debug");
  p.style.left = (e.clientX - _drag.dx) + "px";
  p.style.top  = (e.clientY - _drag.dy) + "px";
});
document.addEventListener("mouseup", () => { _drag = null; });
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ── Start: resume a saved session, else cold-open ─────────── */
startWorld();                               // simulated teammates / reminders tick in the background
if (load() && state.messages.length) {
  render();                                 // straight back into the saved session
} else {
  render();                                 // intro: black canvas + watermark
  setThinking(true);                        // agent "boots up" — spins during cold open
  setTimeout(() => {
    state.phase = "onboarding";
    goNode("start");
    setThinking(false);
    render();
  }, 1400);
}
</script>
</body>
</html>
